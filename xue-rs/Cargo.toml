[package]
name = "xue"
version = "1.0.0"
edition = "2021"
description = "Xue — High-performance continuous internet crawler with Tor support"
license = "MIT"

[[bin]]
name = "xue"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client with SOCKS5 proxy support
reqwest = { version = "0.12", features = ["gzip", "deflate", "socks", "rustls-tls"], default-features = false }

# HTML parsing
scraper = "0.21"

# URL handling
url = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System info
sysinfo = "0.32"

# Colored terminal output
colored = "2"

# Graceful shutdown
ctrlc = { version = "3", features = ["termination"] }

# Time
chrono = "0.4"

# Dashmap for concurrent hashmap
dashmap = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
