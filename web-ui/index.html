<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xue Crawler Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
h1 { color: #58a6ff; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
.card h3 { color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 700; color: #58a6ff; }
#status { color: #3fb950; }
</style>
</head>
<body>
<h1>Xue Crawler Dashboard</h1>
<div class="grid" id="stats"></div>
<script>
async function fetchStats() {
  try {
    const res = await fetch('/api/v1/health');
    const data = await res.json();
    document.getElementById('stats').innerHTML = `
      <div class="card"><h3>Status</h3><div class="stat-value" id="status">${data.status}</div></div>
      <div class="card"><h3>Version</h3><div class="stat-value">${data.version}</div></div>
    `;
  } catch(e) {
    document.getElementById('stats').innerHTML = `<div class="card"><h3>Error</h3><div class="stat-value">${e.message}</div></div>`;
  }
}
fetchStats();
setInterval(fetchStats, 5000);
</script>
</body>
</html>
